<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilities - Kamal Kumar Paul Research Group</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
      <nav>
        <!-- NEW: Wraps the logo and text together side-by-side -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <!-- Hidden by default until the script finds a logo in the CMS -->
            <img id="global-nav-logo" src="" alt="Group Logo" style="display: none; max-height: 55px; width: auto; object-fit: contain;">
            
            <div class="nav-brand">
                <a href="index.html" class="logo">Quantum Photonic and Optoelectronic Device Group</a>
                <a href="https://smce.hbut.edu.cn/lqm/index.htm" target="_blank" class="subheading-link">Core Research Group at LQMI</a>
            </div>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="pi.html">Principal Investigator</a></li>
            <li><a href="team.html">Research Group</a></li>
            <li><a href="publications.html">Publications</a></li>
            <li><a href="facilities.html">Facilities</a></li>
            <li><a href="opportunities.html">Opportunities</a></li>
        </ul>
    </nav>
    </header>

    <div class="container" style="margin-top: 40px; min-height: 60vh;">
        
        <div id="dynamic-facilities-container"></div>
        
    </div>

    <footer style="margin-top: 40px;">
        <div class="footer-bottom">
            <p>&copy; 2026 Dr. Kamal Kumar Paul Research Group. All rights reserved.</p>
        </div>
    </footer>

    <script>
        fetch('data/facilities.json')
            .then(response => {
                if (!response.ok) throw new Error("Facilities data not found");
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('dynamic-facilities-container');
                let fullHTML = "";

                // OUTER LOOP: Go through each Category you create in the CMS
                if (data.categories) {
                    data.categories.forEach(category => {
                        
                        // 1. Build the dynamic Heading you typed in the CMS
                        fullHTML += `<h2 class="section-header" style="margin-top: 40px;">${category.heading}</h2>`;
                        
                        // 2. Open a new CSS grid for this specific category
                        fullHTML += `<div class="grid-container">`; 

                        // INNER LOOP: Go through the equipment items inside this specific category
                        if (category.items) {
                            category.items.forEach(item => {
                                // Check for an image, fallback to a placeholder if empty
                                const imgPath = item.photo ? item.photo.replace(/^\//, '') : 'placeholder.jpg';
                                
                                // Build the card
                                fullHTML += `
                                    <div class="card">
                                        <img src="${imgPath}" alt="${item.name}" style="width:100%; border-radius: 5px; margin-bottom: 15px;">
                                        <h3 style="margin: 0; color: #003366;">${item.name}</h3>
                                        <p style="margin-top: 10px; color: #555; font-size: 0.95rem;">${item.description}</p>
                                    </div>
                                `;
                            });
                        }
                        
                        // 3. Close the CSS grid before moving to the next category
                        fullHTML += `</div>`; 
                    });
                }
                
                // Inject the entire nested structure into the page at once
                container.innerHTML = fullHTML;
            })
            .catch(error => console.log("Facilities data hasn't been created in the CMS yet.", error));
    </script>
<script>
        fetch('data/settings.json')
            .then(response => {
                if (!response.ok) throw new Error("Settings not found.");
                return response.json();
            })
            .then(data => {
                const root = document.documentElement;
                
                // Inject the CMS values directly into the CSS variables
                if(data.font_family) root.style.setProperty('--main-font', data.font_family);
                if(data.text_size) root.style.setProperty('--text-size', data.text_size + 'px');
                if(data.text_color) root.style.setProperty('--text-color', data.text_color);
                if(data.header_size) root.style.setProperty('--header-size', data.header_size + 'px');
                if(data.container_width) root.style.setProperty('--container-width', data.container_width + 'px');
            })
            .catch(error => console.log("Global settings not yet published.", error));
    </script>
    <script>
        fetch('data/settings.json')
            .then(response => {
                if (!response.ok) throw new Error("Settings not found.");
                return response.json();
            })
            .then(data => {
                const root = document.documentElement;
                if(data.font_family) root.style.setProperty('--main-font', data.font_family);
                if(data.text_size) root.style.setProperty('--text-size', data.text_size + 'px');
                if(data.text_color) root.style.setProperty('--text-color', data.text_color);
                if(data.header_size) root.style.setProperty('--header-size', data.header_size + 'px');
                if(data.container_width) root.style.setProperty('--container-width', data.container_width + 'px');

                // --- 1. Main Group Name ---
                if(data.group_name) {
                    document.querySelectorAll('.logo').forEach(logo => {
                        logo.innerText = data.group_name;
                    });
                    
                    document.querySelectorAll('footer .footer-bottom p').forEach(footer => {
                        const currentYear = new Date().getFullYear();
                        footer.innerHTML = `&copy; ${currentYear} ${data.group_name}. All rights reserved.`;
                    });

                    const currentTitle = document.title;
                    if (currentTitle.includes('-')) {
                        const pageName = currentTitle.split('-')[0].trim();
                        document.title = `${pageName} - ${data.group_name}`;
                    } else {
                        document.title = data.group_name;
                    }
                }
              // --- 2. NEW: Navigation Subheading Text ---
                if(data.nav_subheading) {
                    document.querySelectorAll('.subheading-link').forEach(link => {
                        link.innerText = data.nav_subheading;
                    });
                }

                // --- 3. NEW: Navigation Subheading Link ---
                if(data.nav_subheading_link) {
                    document.querySelectorAll('.subheading-link').forEach(link => {
                        link.href = data.nav_subheading_link;
                    });
                }

                // --- 4. NEW: Header Logo ---
                if(data.header_logo) {
                    document.querySelectorAll('#global-nav-logo').forEach(img => {
                        // Cleans the image path and applies it to the src
                        img.src = data.header_logo.replace(/^\//, '');
                        // Unhides the image so it appears on the page
                        img.style.display = "block"; 
                    });
                }
            })
            .catch(error => console.log("Global settings not yet published.", error));
    </script>
    </script>
</body>
</html>
