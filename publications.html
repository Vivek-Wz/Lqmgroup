<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - Kamal Kumar Paul Research Group</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">LQM Group</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="publications.html" class="active">Publications</a></li>
                <li><a href="facilities.html">Facilities</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" style="margin-top: 40px; min-height: 60vh;">
        <h2 class="section-header" id="pubs">Selected Publications</h2>
        
        <div id="dynamic-publications"></div>
        
    </div>

    <footer style="margin-top: 40px;">
        <div class="footer-bottom">
            <p>&copy; 2026 Dr. Kamal Kumar Paul Research Group. All rights reserved.</p>
        </div>
    </footer>

    <script>
        fetch('data/publications.json')
            .then(response => {
                if (!response.ok) throw new Error("Publications data not found");
                return response.json();
            })
            .then(data => {
                const pubsContainer = document.getElementById('dynamic-publications');
                let allPubsHTML = "";

                // Sort the papers by year (newest first) automatically
                const sortedPapers = data.papers.sort((a, b) => b.year - a.year);

                // Loop through every paper in the CMS
                sortedPapers.forEach((paper) => {
                    allPubsHTML += `
                        <div class="publication-card" style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
                            <h3 style="margin: 0; color: #003366; font-size: 1.2rem;">${paper.title}</h3>
                            <p style="margin: 5px 0; color: #333;">${paper.authors}</p>
                            <p style="margin: 0; color: #555;">
                                <em>${paper.journal}</em> <strong>(${paper.year})</strong>
                            </p>
                        </div>
                    `;
                });

                // Inject all the newly built papers into the webpage
                pubsContainer.innerHTML = allPubsHTML;
            })
            .catch(error => console.log("Publications data hasn't been created in the CMS yet.", error));
    </script>
<script>
        fetch('data/settings.json')
            .then(response => {
                if (!response.ok) throw new Error("Settings not found.");
                return response.json();
            })
            .then(data => {
                const root = document.documentElement;
                
                // Inject the CMS values directly into the CSS variables
                if(data.font_family) root.style.setProperty('--main-font', data.font_family);
                if(data.text_size) root.style.setProperty('--text-size', data.text_size + 'px');
                if(data.text_color) root.style.setProperty('--text-color', data.text_color);
                if(data.header_size) root.style.setProperty('--header-size', data.header_size + 'px');
                if(data.container_width) root.style.setProperty('--container-width', data.container_width + 'px');
            })
            .catch(error => console.log("Global settings not yet published.", error));
    </script>
    <script>
        fetch('data/settings.json')
            .then(response => {
                if (!response.ok) throw new Error("Settings not found.");
                return response.json();
            })
            .then(data => {
                // 1. Update CSS Variables
                const root = document.documentElement;
                if(data.font_family) root.style.setProperty('--main-font', data.font_family);
                if(data.text_size) root.style.setProperty('--text-size', data.text_size + 'px');
                if(data.text_color) root.style.setProperty('--text-color', data.text_color);
                if(data.header_size) root.style.setProperty('--header-size', data.header_size + 'px');
                if(data.container_width) root.style.setProperty('--container-width', data.container_width + 'px');

                // 2. Update the Research Group Name Globally
                if(data.group_name) {
                    // Update Navigation Logo
                    document.querySelectorAll('.logo').forEach(logo => {
                        logo.innerText = data.group_name;
                    });
                    
                    // Update Footer Copyright text
                    document.querySelectorAll('footer .footer-bottom p').forEach(footer => {
                        const currentYear = new Date().getFullYear();
                        footer.innerHTML = `&copy; ${currentYear} ${data.group_name}. All rights reserved.`;
                    });

                    // Update Browser Tab Title safely
                    const currentTitle = document.title;
                    if (currentTitle.includes('-')) {
                        // Keeps page names like "Opportunities -" but swaps the group name
                        const pageName = currentTitle.split('-')[0].trim();
                        document.title = `${pageName} - ${data.group_name}`;
                    } else {
                        document.title = data.group_name;
                    }
                }
            })
            .catch(error => console.log("Global settings not yet published.", error));
    </script>
</body>
</html>
