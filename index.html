<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Photonic and Optoelectronic Device Group</title>
    <!-- This links to your design file! -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <!-- NEW: Wraps the logo and text together side-by-side -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <!-- Hidden by default until the script finds a logo in the CMS -->
            <img id="global-nav-logo" src="" alt="Group Logo" style="display: none; max-height: 55px; width: auto; object-fit: contain;">
            
            <div class="nav-brand">
                <a href="index.html" class="logo">Quantum Photonic and Optoelectronic Device Group</a>
            </div>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="pi.html">Principal Investigator</a></li>
            <li><a href="team.html">Research Group</a></li>
            <li><a href="publications.html">Publications</a></li>
            <li><a href="facilities.html">Facilities</a></li>
            <li><a href="opportunities.html">Opportunities</a></li>
        </ul>
    </nav>

    <!-- Main Container: Image Slider -->
    <section class="slider-container" id="home">
        <div id="dynamic-slider"></div>
        <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
        <a class="next" onclick="changeSlide(1)">&#10095;</a>
    </section>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Research Topics -->
        <h2 class="section-header" id="areas">Research Areas</h2>
        <!-- Added a grid style fallback here to ensure the cards line up beautifully -->
        <div class="grid-container" id="dynamic-research" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
            <!-- JavaScript will inject cards here -->
        </div>

    </div>

    <!-- News & Updates -->
    <div class="news-scroller">
        <h2 class="section-header" id="news">News & Updates</h2>
        <div class="news-track" id="dynamic-news"></div>
    </div>

    <!-- Footer -->
    <footer>
        <!-- NEW: Office Address Container -->
        <div id="global-footer-address" style="margin-bottom: 15px; font-size: 0.95rem; line-height: 1.5; display: none;">
            <!-- JavaScript will inject the address here -->
        </div>

        <div class="footer-bottom" style="border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px;">
            <p>&copy; 2026 Dr. Kamal Kumar Paul Research Group. All rights reserved.</p>
        </div>
    </footer>

    <!-- ========================================== -->
    <!-- THE RESEARCH MODAL (Must be above scripts) -->
    <!-- ========================================== -->
    <div id="researchModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="color: #003366; margin-top: 0;"></h2>
            <img id="modal-image" src="" alt="Research Topic" style="width: 100%; height: auto; max-height: 400px; object-fit: contain; border-radius: 8px; margin-bottom: 20px; display: none;">
            <div id="modal-body" style="line-height: 1.6; text-align: left;"></div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- SCRIPTS -->
    <!-- ========================================== -->

    <!-- 1. Slider Script -->
    <script>
        fetch('data/home.json')
            .then(response => {
                if (!response.ok) throw new Error("Slider data not found");
                return response.json();
            })
            .then(data => {
                const sliderContainer = document.getElementById('dynamic-slider');
                let allSlidesHTML = "";

                data.slider.forEach((slide) => {
                    const imgPath = slide.image ? slide.image.replace(/^\//, '') : '';
                    allSlidesHTML += `
                        <div class="slide fade">
                            <img src="${imgPath}" alt="${slide.heading}">
                            <div class="slide-text">
                                <h1>${slide.heading}</h1>
                                <p>${slide.subtext}</p>
                            </div>
                        </div>
                    `;
                });

                sliderContainer.innerHTML = allSlidesHTML;

                let slideIndex = 1;
                showSlides(slideIndex);

                window.changeSlide = function(n) {
                    showSlides(slideIndex += n);
                };

                function showSlides(n) {
                    let i;
                    let slides = document.getElementsByClassName("slide");
                    if (n > slides.length) {slideIndex = 1}
                    if (n < 1) {slideIndex = slides.length}
                    for (i = 0; i < slides.length; i++) {
                        slides[i].style.display = "none";
                    }
                    if(slides.length > 0) {
                        slides[slideIndex-1].style.display = "block";
                    }
                }
                
                setInterval(function() {
                    changeSlide(1);
                }, 5000); 
            })
            .catch(error => console.log("Slider data hasn't been created in the CMS yet.", error));
    </script>

    <!-- 2. Research & Modal Script -->
    <script>
        let globalResearchData = []; 

        fetch('data/research.json')
            .then(response => response.json())
            .then(data => {
                globalResearchData = data.topics;
                const researchContainer = document.getElementById('dynamic-research');
                let html = "";

                data.topics.forEach((topic, index) => {
                    const imgPath = topic.image ? topic.image.replace(/^\//, '') : 'placeholder.jpg';
                    
                    html += `
                        <div class="card" style="text-align: center; padding: 25px; cursor: pointer; transition: transform 0.2s; border: 1px solid #eaeaea; border-radius: 8px;" onclick="openModal(${index})" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
                            <img src="${imgPath}" style="width: 100%; height: 160px; object-fit: cover; border-radius: 5px; margin-bottom: 15px;">
                            <h3 style="color: #003366; margin: 0 0 10px 0; font-size: 1.3rem;">
                                ${topic.title}
                            </h3>
                            <p style="color: #555; font-size: 0.95rem; margin-bottom: 15px;">${topic.description}</p>
                            <span style="color: #00509e; font-weight: bold; font-size: 0.9rem; border-bottom: 1px solid #00509e; padding-bottom: 2px;">Read More &rarr;</span>
                        </div>
                    `;
                });
                
                researchContainer.innerHTML = html;
            })
            .catch(error => console.log("Error loading research data:", error));

        const modal = document.getElementById('researchModal');

        function openModal(index) {
            const topic = globalResearchData[index];
            const imgPath = topic.image ? topic.image.replace(/^\//, '') : '';
            
            document.getElementById('modal-title').innerText = topic.title;
            document.getElementById('modal-body').innerHTML = topic.long_description || "<p>Detailed information coming soon.</p>";
            
            const modalImg = document.getElementById('modal-image');
            if (imgPath) {
                modalImg.src = imgPath;
                modalImg.style.display = "block";
            } else {
                modalImg.style.display = "none";
            }

            modal.style.display = "block";
            document.body.style.overflow = "hidden"; 
        }

        function closeModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto"; 
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

    <!-- 3. News Script -->
    <script>
        fetch('data/news.json')
            .then(response => {
                if (!response.ok) throw new Error("News data not found");
                return response.json();
            })
            .then(data => {
                const newsContainer = document.getElementById('dynamic-news');
                let singleSetHTML = "";

                data.items.forEach((item) => {
                    const imgPath = item.image ? item.image.replace(/^\//, '') : 'placeholder-news1.jpg';
                    
                    singleSetHTML += `
                        <div class="news-card">
                            <img src="${imgPath}" alt="${item.headline}">
                            <div class="news-content">
                                <span class="news-date">${item.date}</span>
                                <h4>${item.headline}</h4>
                                <p>${item.description}</p>
                            </div>
                        </div>
                    `;
                });

                newsContainer.innerHTML = singleSetHTML + singleSetHTML + singleSetHTML + singleSetHTML;
            })
            .catch(error => console.log("News data hasn't been created in the CMS yet.", error));
    </script>

    <!-- 4. Global Settings Script -->
    <script>
        fetch('data/settings.json')
            .then(response => {
                if (!response.ok) throw new Error("Settings not found.");
                return response.json();
            })
            .then(data => {
                const root = document.documentElement;
                
                // Inject the CMS values directly into the CSS variables
                if(data.font_family) root.style.setProperty('--main-font', data.font_family);
                if(data.text_size) root.style.setProperty('--text-size', data.text_size + 'px');
                if(data.text_color) root.style.setProperty('--text-color', data.text_color);
                if(data.header_size) root.style.setProperty('--header-size', data.header_size + 'px');
                if(data.container_width) root.style.setProperty('--container-width', data.container_width + 'px');
                
                // --- 1. Main Group Name ---
                if(data.group_name) {
                    document.querySelectorAll('.logo').forEach(logo => {
                        logo.innerText = data.group_name;
                    });
                    
                    document.querySelectorAll('footer .footer-bottom p').forEach(footer => {
                        const currentYear = new Date().getFullYear();
                        footer.innerHTML = `&copy; ${currentYear} ${data.group_name}. All rights reserved.`;
                    });

                    const currentTitle = document.title;
                    if (currentTitle.includes('-')) {
                        const pageName = currentTitle.split('-')[0].trim();
                        document.title = `${pageName} - ${data.group_name}`;
                    } else {
                        document.title = data.group_name;
                    }
                }

                // --- 2. NEW: Navigation Subheading Text ---
                if(data.nav_subheading) {
                    document.querySelectorAll('.subheading-link').forEach(link => {
                        link.innerText = data.nav_subheading;
                    });
                }

                // --- 3. NEW: Navigation Subheading Link ---
                if(data.nav_subheading_link) {
                    document.querySelectorAll('.subheading-link').forEach(link => {
                        link.href = data.nav_subheading_link;
                    });
                }

                // --- 4. NEW: Header Logo ---
                if(data.header_logo) {
                    document.querySelectorAll('#global-nav-logo').forEach(img => {
                        // Cleans the image path and applies it to the src
                        img.src = data.header_logo.replace(/^\//, '');
                        // Unhides the image so it appears on the page
                        img.style.display = "block"; 
                    });
                } // <--- THIS WAS THE MISSING BRACKET!

                // --- 5. NEW: Footer Office Address ---
                if(data.footer_address) {
                    document.querySelectorAll('#global-footer-address').forEach(addr => {
                        // The .replace rule ensures that if you hit "Enter" in the CMS to create a new line, it translates properly to HTML!
                        addr.innerHTML = "📍 " + data.footer_address.replace(/\n/g, '<br>');
                        addr.style.display = "block";
                    });
                }
            })
            .catch(error => console.log("Global settings not yet published.", error));
    </script>
</body>
</html>
