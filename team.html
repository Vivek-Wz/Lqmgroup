<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Group - Paul Research Group</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* Specific styling to make team profile pictures circular and uniform */
        .member-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            background-color: #e0e0e0;
            border: 3px solid var(--light-gray);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Paul Research Group</a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="pi.html">Principal Investigator</a></li>
            <li><a href="team.html">Research Group</a></li>
            <li><a href="publications.html">Publications</a></li>
            <li><a href="facilities.html">Facilities</a></li>
        </ul>
    </nav>

    <section class="hero" style="padding: 40px 20px;">
        <h1>Research Group</h1>
        <p>The researchers and scholars driving our innovations in quantum materials.</p>
    </section>

    <div class="container">
        <h2 class="section-header" id="team">Research Group</h2>
        
        <div class="grid-container" id="dynamic-team"></div>
        
    </div>

    <footer>
        <p>&copy; 2026 Dr. Kamal Kumar Paul Research Group. All rights reserved.</p>
    </footer>
<script>
        fetch('data/team.json')
            .then(response => {
                if (!response.ok) throw new Error("Team data not found");
                return response.json();
            })
            .then(data => {
                const teamContainer = document.getElementById('dynamic-team');
                let allMembersHTML = "";

                // Loop through every team member in the CMS
                data.members.forEach((member) => {
                    // Check if a photo was uploaded, otherwise use a blank placeholder
                    const imgPath = member.photo ? member.photo.replace(/^\//, '') : 'placeholder.jpg';
                    
                    // Build the HTML card for each person
                    allMembersHTML += `
                        <div class="card">
                            <img src="${imgPath}" alt="${member.name}" style="width:100%; border-radius: 5px; margin-bottom: 15px;">
                            <h3 style="margin: 0; color: #003366;">${member.name}</h3>
                            <p style="margin-top: 5px; font-weight: bold; color: #555;">${member.role}</p>
                        </div>
                    `;
                });

                // Inject all the newly built cards into the webpage grid
                teamContainer.innerHTML = allMembersHTML;
            })
            .catch(error => console.log("Team data hasn't been created in the CMS yet.", error));
    </script>
</body>
</html>
