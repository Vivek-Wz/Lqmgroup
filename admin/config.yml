backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - label: "Global Design Settings"
        name: "settings"
        file: "data/settings.json"
        fields:
          - {label: "Research Group Name", name: "group_name", widget: "string", default: "Institute of Low-Dimensional Quantum Materials",required: false}
          - {label: "Base Font Family", name: "font_family", widget: "select", options: ["'Inter', sans-serif", "'Roboto', sans-serif", "'Playfair Display', serif", "system-ui, sans-serif"],required: false}
          - {label: "Body Text Size (px)", name: "text_size", widget: "number", value_type: "int", default: 16, min: 12, max: 24,required: false}
          - {label: "Body Text Color", name: "text_color", widget: "color", default: "#333333",required: false}
          - {label: "Primary Header Size (px)", name: "header_size", widget: "number", value_type: "int", default: 32, min: 20, max: 60,required: false}
          - {label: "Main Container Width (px)", name: "container_width", widget: "number", value_type: "int", default: 1100, step: 50,required: false}

      - label: "Homepage Settings"
        name: "home"
        file: "data/home.json"
        fields:
          - label: "Image Slider"
            name: "slider"
            widget: "list"
            fields:
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Subtext", name: "subtext", widget: "string"}

      - label: "Research Data"
        name: "research"
        file: "data/research.json"
        fields:
          - label: "Research Topics"
            name: "topics"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Short Description", name: "description", widget: "text"}
              - {label: "Long Technical Details", name: "long_description", widget: "markdown"}
              - {label: "Thumbnail/Modal Image", name: "image", widget: "image", required: false}

      - label: "News & Updates"
        name: "news"
        file: "data/news.json"
        fields:
          - label: "News Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Headline", name: "headline", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image", name: "image", widget: "image", required: false}

      - label: "Principal Investigator Page"
        name: "pi"
        file: "data/pi.json"
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Academic Title", name: "title", widget: "string"}
          - {label: "Biography", name: "bio", widget: "text"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Profile Photo", name: "photo", widget: "image"}
          - label: "Education & Academic Background"
            name: "education"
            widget: "list"
            fields:
              - {label: "Year (e.g., 2017 - 2021)", name: "year", widget: "string"}
              - {label: "Degree / Position", name: "degree", widget: "string"}
              - {label: "Institution & Location", name: "institution", widget: "string"}
              - {label: "Extra Details (e.g., Thesis Title)", name: "details", widget: "string", required: false}
          - label: "Professional Experience"
            name: "experience"
            widget: "list"
            fields:
              - {label: "Year (e.g., 2021 - Present)", name: "year", widget: "string"}
              - {label: "Job Title", name: "title", widget: "string"}
              - {label: "Institution", name: "institution", widget: "string"}
          - label: "Selected Honors & Awards"
            name: "awards"
            widget: "list"
            fields:
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Award Name", name: "name", widget: "string"}
              - {label: "Awarding Organization", name: "organization", widget: "string"}
